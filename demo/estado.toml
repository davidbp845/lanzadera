# Estado ficticio de la demo pública (ADR-0010): lo que fuera de la demo sale de los
# puertos, `psutil`, `nvidia-smi`, `gh`, `git log` y `dev_up.sh --listar`.

# Puertos en escucha.
activos = [8501, 8510, 8511, 8520, 8540, 8541, 8570, 3100, 3101, 8000]

# RAM total de la máquina y memoria de la GPU, en GB.
memoria_total_gb = 16
memoria_gpu_gb = 8

# Lo que devolvería `dev_up.sh --listar` en el proyecto de negocios.
negocios = [
  { id = "acme", front = 3100, panel = 3101, api = 8000 },
  { id = "bloom", front = 3110, panel = 3111, api = 8010 },
]

# Repositorio y tablero de cada proyecto (por slug; `negocios`, el del proyecto de los
# negocios; un negocio, por su id, con el de su carpeta: `bloom` no tiene),
# con sus items por estado: Backlog, Ready, In progress, In review, Done; `en_curso`, los
# issues In progress con una sesión de Claude Code trabajando ahora (su pastilla parpadea).
[github.launchpad]
repo = "https://github.com/davidbp845/lanzadera"
cuenta = [3, 2, 1, 2, 41]
en_curso = ["#3 Blink In progress while a Claude Code session works on an issue"]
